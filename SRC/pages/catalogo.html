<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catálogo de Produtos | FAIZER3D</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="../STYLE.CSS">
</head>

<body class="pagina-catalogo">

    <main class="catalogo-container">

        <!-- CABEÇALHO -->
        <header class="catalogo-cabecalho">

            <div>
                <h1>Catálogo de Produtos</h1>

                <p>
                    Conheça nossos produtos personalizados em impressão 3D.
                </p>
            </div>

            <a href="../INDEX.HTML" class="botao-voltar">
                ← Voltar ao menu
            </a>

        </header>


        <!-- FILTROS -->
        <section class="catalogo-filtros">

            <input
                type="search"
                id="catalogoPesquisa"
                placeholder="Pesquisar produto ou categoria..."
                autocomplete="off"
            >

            <select id="filtroCategoria">
                <option value="">Todas as categorias</option>
            </select>

        </section>


        <!-- LISTA DE PRODUTOS -->
        <section
            id="listaCatalogo"
            class="catalogo-grade"
        >
            <!--
                Os produtos cadastrados serão
                inseridos aqui pelo JavaScript.
            -->
        </section>


        <!-- CATÁLOGO VAZIO -->
        <div
            id="catalogoVazio"
            class="catalogo-vazio"
            hidden
        >

            <h2>Nenhum produto encontrado</h2>

            <p>
                Cadastre um produto para que ele apareça no catálogo.
            </p>

        </div>

    </main>


    <!-- JAVASCRIPT DO CATÁLOGO -->
    <script src="../catalogo.js"></script>

</body>

</html>
